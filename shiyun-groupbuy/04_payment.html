<!-- ═══════════════ 付款方式 ═══════════════
     這支檔案可以單獨開、單獨改，改完跑 bash build.sh 重組 index.html
     固定四項：信用卡／超商取貨付款／Apple Pay／LINE Pay（不列超商貨到付款）
     ══════════════════════════════════════════ -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@500;600;700&family=Outfit:wght@300;400;600;700&display=swap');

/* ── 共用底（每支區塊各有一份，改這支不會影響其他區塊）── */
.sy{
  --ink:#1A1918; --ink-2:#3D3B38; --muted:#8B8783; --line:#E4E1DC;
  --paper:#F7F6F3; --mist:#EFEDE9; --nude:#C3A092; --nude-soft:#EFE3DC; --card:#fff;
  font-family:'Noto Sans TC','PingFang TC','Helvetica Neue',Arial,sans-serif;
  color:var(--ink); font-size:16px; line-height:1.78; text-align:left;
  max-width:820px; margin:52px auto 0; padding:0 16px;
}
.sy *{box-sizing:border-box; margin:0; padding:0; min-width:0;}
.sy img{max-width:100%; height:auto; display:block;}
.sy :focus-visible{outline:2px solid var(--ink); outline-offset:3px;}
.sy .sy-h2{
  display:flex; align-items:center; gap:14px; font-family:'Outfit',sans-serif;
  font-size:10.5px; font-weight:600; letter-spacing:.34em; color:var(--muted);
  text-transform:uppercase; margin-bottom:8px;
}
.sy .sy-h2::after{content:""; flex:1; height:1px; background:var(--line);}
.sy .sy-title{
  font-family:'Noto Serif TC',serif; font-size:23px; font-weight:600;
  letter-spacing:.05em; line-height:1.5; margin-bottom:6px;
}
.sy .sy-lead{font-size:14.5px; color:var(--muted); margin:0 0 20px;}
@media (prefers-reduced-motion:reduce){
  .sy *,.sy *::before,.sy *::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
}

/* ── 本區塊專用 ── */
.sy-pay .pay{display:grid; grid-template-columns:repeat(2,1fr); gap:1px; background:var(--line); border:1px solid var(--line);}
.sy-pay .pay-item{background:var(--card); padding:18px 12px; text-align:center;}
.sy-pay .pay-item svg{width:22px; height:22px; stroke:var(--ink); fill:none; stroke-width:1.4; margin:0 auto 8px;}
.sy-pay .pay-item b{display:block; font-size:14px; letter-spacing:.03em;}
.sy-pay .pay-item span{display:block; font-size:11.5px; color:var(--muted); line-height:1.6; margin-top:3px;}
@media (min-width:721px){ .sy-pay .pay{grid-template-columns:repeat(4,1fr);} }
</style>

<section class="sy sy-pay">
  <h2 class="sy-h2">Payment</h2>
  <p class="sy-title">付款方式</p>
  <div class="pay">
    <div class="pay-item">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5.5" width="19" height="13" rx="2.5"/><path d="M2.5 10h19"/></svg>
      <b>信用卡</b><span>15 分鐘內完成付款</span>
    </div>
    <div class="pay-item">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h16V20H4z"/><path d="M3 9.5L5 4h14l2 5.5"/><path d="M9 20v-5h6v5"/></svg>
      <b>超商取貨付款</b><span>取貨時於門市付款</span>
    </div>
    <div class="pay-item">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5c1.5 0 2.4-.8 3-1.9-.6-.1-1.5.2-2.2.8-.6.5-1 1.2-.8 1.1z"/><path d="M15.5 6.5c-1.3 0-2.2.8-3.3.8s-2-.8-3.4-.8C6.2 6.5 4 8.6 4 12.6c0 3.4 2.4 8.4 4.5 8.4 1.2 0 1.8-.8 3.5-.8s2.2.8 3.5.8c2 0 3.7-3.6 4.2-5.4-2.2-.9-2.9-4.1-.9-5.6-.8-1.5-2.1-2.5-3.3-2.5z"/></svg>
      <b>Apple Pay</b><span>15 分鐘內完成付款</span>
    </div>
    <div class="pay-item">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></svg>
      <b>LINE Pay</b><span>15 分鐘內完成付款</span>
    </div>
  </div>
</section>
