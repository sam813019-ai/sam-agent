<!-- ═══════════════ 編輯風形象帶（第二張形象照 ＋ 團主的話） ═══════════════
     YB 9/21 版沒有這一段，是為詩芸的黑白編輯照多加的。
     不想要就把這支檔案刪掉（或改名成 _03_editorial.html 讓 build.sh 略過），再跑 bash build.sh。
     照片已上傳 Shopline 圖床、用絕對網址（assets/sy_editorial.jpg 只是本機備份）。
     ══════════════════════════════════════════ -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;600;700&display=swap');

.sy-ed{
  --ink:#1A1918; --muted:#8B8783; --line:#E4E1DC; --nude:#C3A092;
  font-family:'Noto Sans TC','PingFang TC','Helvetica Neue',Arial,sans-serif;
  max-width:820px; margin:56px auto 0; padding:0 16px; color:var(--ink);
}
.sy-ed *{box-sizing:border-box; margin:0; padding:0; min-width:0;}
.sy-ed .band{display:grid; gap:0; border:1px solid var(--line); background:#fff;}
.sy-ed figure{margin:0; overflow:hidden; background:#EFEDE9;}
.sy-ed img{width:100%; display:block; aspect-ratio:4/5; object-fit:cover; object-position:50% 28%;}
.sy-ed .say{padding:28px 22px 30px;}
.sy-ed .mark{
  font-family:'Cormorant Garamond',serif; font-size:44px; line-height:.7;
  color:var(--nude); display:block; margin-bottom:10px;
}
.sy-ed blockquote{
  font-family:'Noto Serif TC',serif; font-size:17px; font-weight:500;
  line-height:2; letter-spacing:.04em; color:var(--ink);
}
.sy-ed .by{
  display:flex; align-items:center; gap:10px; margin-top:18px;
  font-family:'Outfit',sans-serif; font-size:10.5px; font-weight:600;
  letter-spacing:.3em; text-transform:uppercase; color:var(--muted);
}
.sy-ed .by::before{content:""; width:26px; height:1px; background:var(--nude); flex:0 0 26px;}
@media (min-width:721px){
  .sy-ed .band{grid-template-columns:1fr 1fr; align-items:stretch;}
  .sy-ed img{height:100%; aspect-ratio:auto; min-height:420px;}
  .sy-ed .say{padding:46px 40px; align-self:center;}
  .sy-ed blockquote{font-size:19px;}
}
</style>

<section class="sy-ed">
  <div class="band">
    <figure><img src="https://img.shoplineapp.com/media/image_clips/6abb4c36c8504edadf43c891/original.jpg?1790659638=&owner_id=648be21890a1b5008d602f77" alt="團主詩芸的形象照" loading="lazy"></figure>
    <div class="say">
      <span class="mark" aria-hidden="true">&ldquo;</span>
      <blockquote>我挑東西的標準很簡單：<br>能每天用、不用想太多、<br>出門前 30 秒就能搞定。<br>這三支就是我包包裡一直有的。</blockquote>
      <p class="by">詩芸</p>
    </div>
  </div>
</section>
