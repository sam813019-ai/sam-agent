<!-- ═══════════════ 團購品項 ═══════════════
     這支檔案可以單獨開、單獨改，改完跑 bash build.sh 重組 index.html
     產品圖直接吃 Shopline 圖床（與 YB 9/21 同一組圖），不需要放進 assets/
     ══════════════════════════════════════════ -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@500;600;700&family=Outfit:wght@300;400;600;700&display=swap');

/* ── 共用底（每支區塊各有一份，改這支不會影響其他區塊）── */
.sy{
  --ink:#1A1918; --ink-2:#3D3B38; --muted:#8B8783; --line:#E4E1DC;
  --paper:#F7F6F3; --mist:#EFEDE9; --nude:#C3A092; --nude-soft:#EFE3DC; --card:#fff;
  font-family:'Noto Sans TC','PingFang TC','Helvetica Neue',Arial,sans-serif;
  color:var(--ink); font-size:16px; line-height:1.78; text-align:left;
  max-width:820px; margin:52px auto 0; padding:0 16px;
}
.sy *{box-sizing:border-box; margin:0; padding:0; min-width:0;}
.sy img{max-width:100%; height:auto; display:block;}
.sy :focus-visible{outline:2px solid var(--ink); outline-offset:3px;}
.sy .sy-h2{
  display:flex; align-items:center; gap:14px; font-family:'Outfit',sans-serif;
  font-size:10.5px; font-weight:600; letter-spacing:.34em; color:var(--muted);
  text-transform:uppercase; margin-bottom:8px;
}
.sy .sy-h2::after{content:""; flex:1; height:1px; background:var(--line);}
.sy .sy-title{
  font-family:'Noto Serif TC',serif; font-size:23px; font-weight:600;
  letter-spacing:.05em; line-height:1.5; margin-bottom:6px;
}
.sy .sy-lead{font-size:14.5px; color:var(--muted); margin:0 0 20px;}
@media (prefers-reduced-motion:reduce){
  .sy *,.sy *::before,.sy *::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
}

/* ── 本區塊專用 ── */
.sy-items .items{display:grid; gap:14px;}
.sy-items .item{
  display:grid; grid-template-columns:104px 1fr; gap:16px; align-items:center;
  background:var(--card); border:1px solid var(--line); padding:16px;
}
/* 圖框固定 1:1，美編上傳 1200×1200 正方圖即零裁切 */
.sy-items .item-fig{background:var(--mist); aspect-ratio:1/1; overflow:hidden;}
/* 三張都是情境照（非去背），一律滿版填滿框、不留白邊 */
.sy-items .item-fig img{width:100%; height:100%; object-fit:cover; object-position:center;}
.sy-items .fig-stick img{object-position:48% 52%;}  /* 方形 1:1：接近置中 */
.sy-items .fig-spray img{object-position:62% 60%;}  /* 橫幅 3:2：瓶身偏右下 */
.sy-items .fig-mist  img{object-position:50% 42%;}  /* 直幅 2:3：瓶身偏上 */
.sy-items .item.is-new .item-fig{background:var(--nude-soft);}
.sy-items .item h3{font-family:'Noto Serif TC',serif; font-size:17.5px; font-weight:600; letter-spacing:.03em;}
.sy-items .tag-new{
  display:inline-block; vertical-align:3px; margin-left:8px; padding:2px 8px;
  background:var(--ink); color:#F7F6F3;
  font-family:'Outfit',sans-serif; font-size:9.5px; font-weight:600; letter-spacing:.16em;
}
.sy-items .spec{font-family:'Outfit',sans-serif; font-size:11.5px; color:var(--nude); letter-spacing:.1em; margin-top:4px; text-transform:uppercase;}
.sy-items .item p.desc{font-size:13.5px; color:var(--muted); margin-top:8px; line-height:1.75;}
@media (min-width:721px){
  .sy-items .items{grid-template-columns:repeat(3,1fr);}  /* 三項 → 桌機一排三欄 */
  .sy-items .item{grid-template-columns:1fr; text-align:center; padding:22px 18px;}
  .sy-items .spec{letter-spacing:.14em;}
}
</style>

<section class="sy sy-items">
  <h2 class="sy-h2">Items</h2>
  <p class="sy-title">團購品項</p>
  <p class="sy-lead">詩芸的日常三支：防曬、潤色、保濕，一次帶齊。</p>

  <div class="items">
    <article class="item is-new">
      <div class="item-fig fig-stick"><img src="https://img.shoplineapp.com/media/image_clips/6a86b154b757ce93911d434e/original.jpg?1787212116=&owner_id=648be21890a1b5008d602f77" alt="HEIWEI 爆白潤色防曬棒 SPF50+" loading="lazy"></div>
      <div>
        <h3>爆白潤色防曬棒<span class="tag-new">NEW</span></h3>

        <p class="desc">免沾手推開就好，自帶潤色可當底妝，補防曬不用毀妝。</p>
      </div>
    </article>

    <article class="item">
      <div class="item-fig fig-spray"><img src="https://img.shoplineapp.com/media/image_clips/6a86a1da4a84ab3e83e861ee/original.jpg?1787208152=&owner_id=648be21890a1b5008d602f77" alt="HEIWEI 爆白防曬隔離噴霧 2.0" loading="lazy"></div>
      <div>
        <h3>爆白防曬隔離噴霧</h3>

      </div>

    <article class="item">
      <div class="item-fig fig-mist"><img src="https://img.shoplineapp.com/media/image_clips/6a86a1b2c90b232686b52554/original.JPG?1787208111=&owner_id=648be21890a1b5008d602f77" alt="HEIWEI 活氧 B 群保濕噴霧 100ml" loading="lazy"></div>
      <div>
        <h3>活氧 B 群保濕噴霧</h3>

      </div>
    </article>
  </div>
</section>
