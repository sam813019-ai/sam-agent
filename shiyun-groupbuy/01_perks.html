<!-- ═══════════════ 開團好康 ═══════════════
     這支檔案可以單獨開、單獨改，改完跑 bash build.sh 重組 index.html
     ══════════════════════════════════════════ -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@500;600;700&family=Outfit:wght@300;400;600;700&display=swap');

/* ── 共用底（每支區塊各有一份，改這支不會影響其他區塊）── */
.sy{
  --ink:#1A1918; --ink-2:#3D3B38; --muted:#8B8783; --line:#E4E1DC;
  --paper:#F7F6F3; --mist:#EFEDE9; --nude:#C3A092; --nude-soft:#EFE3DC; --card:#fff;
  font-family:'Noto Sans TC','PingFang TC','Helvetica Neue',Arial,sans-serif;
  color:var(--ink); font-size:16px; line-height:1.78; text-align:left;
  max-width:820px; margin:52px auto 0; padding:0 16px;
}
.sy *{box-sizing:border-box; margin:0; padding:0; min-width:0;}
.sy img{max-width:100%; height:auto; display:block;}
.sy :focus-visible{outline:2px solid var(--ink); outline-offset:3px;}
.sy .sy-h2{
  display:flex; align-items:center; gap:14px; font-family:'Outfit',sans-serif;
  font-size:10.5px; font-weight:600; letter-spacing:.34em; color:var(--muted);
  text-transform:uppercase; margin-bottom:8px;
}
.sy .sy-h2::after{content:""; flex:1; height:1px; background:var(--line);}
.sy .sy-title{
  font-family:'Noto Serif TC',serif; font-size:23px; font-weight:600;
  letter-spacing:.05em; line-height:1.5; margin-bottom:6px;
}
.sy .sy-lead{font-size:14.5px; color:var(--muted); margin:0 0 20px;}
@media (prefers-reduced-motion:reduce){
  .sy *,.sy *::before,.sy *::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
}

/* ── 本區塊專用 ── */
.sy-perks .perks{display:grid; gap:1px; background:var(--line); border:1px solid var(--line);}
.sy-perks .perk{display:flex; gap:15px; align-items:flex-start; background:var(--card); padding:20px 18px;}
.sy-perks .perk-n{
  flex:0 0 auto; font-family:'Outfit',sans-serif; font-weight:300; font-size:26px;
  line-height:1; color:var(--nude); letter-spacing:-.02em; padding-top:2px;
}
.sy-perks .perk b{display:block; font-size:16px; font-weight:700; letter-spacing:.02em; line-height:1.6;}
.sy-perks .perk p{font-size:13.5px; color:var(--muted); margin-top:3px; line-height:1.75;}
/* 限量標籤（前 100 名） */
.sy-perks .tag-limit{
  display:inline-block; vertical-align:2px; margin-left:7px; padding:2px 8px;
  background:var(--ink); color:#F7F6F3;
  font-family:'Outfit',sans-serif; font-size:9.5px; font-weight:600; letter-spacing:.14em;
}
@media (min-width:721px){
  .sy-perks .perks{grid-template-columns:repeat(3,1fr);}
  .sy-perks .perk{flex-direction:column; gap:10px; padding:24px 20px;}
}
</style>

<section class="sy sy-perks">
  <h2 class="sy-h2">Perks</h2>
  <p class="sy-title">這一團的三個好康</p>
  <p class="sy-lead">開團六天，三重禮一起送。</p>

  <div class="perks">
    <div class="perk">
      <span class="perk-n">01</span>
      <div>
        <b>單筆滿 $1,000 免運</b>
        <p>台灣本島與離島均適用，以單筆訂單金額計算。</p>
      </div>
    </div>
    <div class="perk">
      <span class="perk-n">02</span>
      <div>
        <b>前 100 名下單送光透波 5D 養膚面膜<span class="tag-limit">限量</span></b>
        <p>乙片，依系統訂單成立順序計算，送完為止。</p>
      </div>
    </div>
    <div class="perk">
      <span class="perk-n">03</span>
      <div>
        <b>單筆滿 $4,000 送潔淨舒壓洗面乳 100ml</b>
        <p>正貨乙支（價值 $1,080），隨單附贈、不需登記，可與下單禮疊加。</p>
      </div>
    </div>
  </div>
</section>
