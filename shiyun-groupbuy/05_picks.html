<!-- ═══════════════ 主標題區塊：詩芸的選物清單 ═══════════════
     這支只放標題，下面接商品列表（Shopline 商品直接放在這段之後）。
     色碼直接寫死、不用 CSS 變數：一來不會被外層主題的 --c-primary 蓋掉，
     二來貼進 Shopline 也不會因為變數被過濾而失色。
     副標不要的話，把 <p class="sy-mt-sub"> 那一行刪掉即可。
     ══════════════════════════════════════════ -->
<style>
  .sy-mt{
    font-family:'Noto Sans TC','PingFang TC','Helvetica Neue',Arial,sans-serif;
    max-width:820px; margin:60px auto 26px; padding:0 16px; text-align:center; color:#1A1918;
  }
  .sy-mt *{box-sizing:border-box; margin:0; padding:0;}
  .sy-mt-eyebrow{
    font-family:'Outfit','Helvetica Neue',Arial,sans-serif;
    font-size:10.5px; font-weight:600; letter-spacing:.38em; color:#8B8783;
    text-transform:uppercase; display:block; margin-bottom:14px;
  }
  .sy-mt h2{
    font-family:'Noto Serif TC','Songti TC',serif;
    font-size:26px; font-weight:600; letter-spacing:.1em; line-height:1.45; color:#1A1918;
  }
  .sy-mt-sub{font-size:14px; color:#8B8783; margin-top:10px !important; letter-spacing:.03em;}
  /* 標題下方的細線與中央小方塊 */
  .sy-mt-rule{display:flex; align-items:center; justify-content:center; gap:9px; margin-top:18px;}
  .sy-mt-rule i{display:block; width:52px; height:1px; background:linear-gradient(90deg,rgba(26,25,24,0),rgba(26,25,24,.32));}
  .sy-mt-rule i+i{background:linear-gradient(90deg,rgba(26,25,24,.32),rgba(26,25,24,0));}
  .sy-mt-rule span{width:5px; height:5px; background:#C3A092; transform:rotate(45deg);}
  @media (min-width:721px){
    .sy-mt{margin:72px auto 30px;}
    .sy-mt h2{font-size:33px;}
  }
</style>

<div class="sy-mt">
  <span class="sy-mt-eyebrow">Shiyun&rsquo;s Picks</span>
  <h2>詩芸的選物清單</h2>
  <p class="sy-mt-sub">本團商品都在這裡，挑順手的帶回家</p>
  <div class="sy-mt-rule"><i></i><span></span><i></i></div>
</div>
