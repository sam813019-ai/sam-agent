<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yboutique 優惠倒數</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@400;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --c-primary:    #c9a98a;
      --c-primary-dk: #b08d7a;
      --c-accent:     #a0694a;
      --c-border:     #e8ddd5;
      --c-text:       #2d2d2d;
      --c-muted:      #a88060;
    }

    body {
      background: #ffffff;
      font-family: 'Noto Sans TC', 'Helvetica Neue', Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .yb-wrap {
      width: 100%;
      max-width: 780px;
    }

    /* ── 主容器 ── */
    .yb-countdown-bar {
      position: relative;
      overflow: hidden;
      border-radius: 14px;
      background: linear-gradient(160deg, #fdf6ee 0%, #f5e8d8 55%, #ede0cc 100%);
      border: 2px solid var(--c-border);
      padding: 20px 28px 22px;
      margin-bottom: 28px;
      box-shadow:
        0 2px 16px rgba(180, 130, 90, 0.12),
        0 1px 0 rgba(255, 255, 255, 0.8) inset;
    }

    /* 背景光暈 */
    .yb-countdown-bar::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(ellipse 55% 70% at 85% 50%, rgba(201, 169, 138, 0.18) 0%, transparent 65%),
        radial-gradient(ellipse 40% 50% at 10% 50%, rgba(255, 230, 200, 0.2) 0%, transparent 60%);
      pointer-events: none;
    }

    /* 左側裝飾光條 */
    .yb-countdown-bar::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: linear-gradient(180deg, #d4a060 0%, #c9a98a 50%, #b08d7a 100%);
      border-radius: 14px 0 0 14px;
    }

    /* ── 頂部標籤列 ── */
    .yb-cd-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .yb-cd-label {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .yb-cd-flame {
      font-size: 16px;
      animation: flicker 1.8s ease-in-out infinite alternate;
    }

    @keyframes flicker {
      0%   { transform: scale(1)    rotate(-3deg); opacity: 0.9; }
      50%  { transform: scale(1.15) rotate(2deg);  opacity: 1; }
      100% { transform: scale(0.95) rotate(-5deg); opacity: 0.85; }
    }

    .yb-cd-label-text {
      font-family: 'Noto Serif TC', serif;
      font-size: 14px;
      font-weight: 700;
      color: var(--c-accent);
      letter-spacing: 2px;
    }

    .yb-cd-deadline {
      font-size: 11px;
      font-weight: 500;
      color: var(--c-muted);
      letter-spacing: 1px;
    }

    /* ── 數字區塊 ── */
    .yb-cd-units {
      display: flex;
      align-items: flex-end;
      gap: 0;
    }

    .yb-cd-unit {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .yb-cd-num-wrap {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .yb-cd-num {
      font-family: 'DM Mono', 'Courier New', monospace;
      font-size: clamp(32px, 8vw, 52px);
      font-weight: 500;
      color: #3a2010;
      line-height: 1;
      letter-spacing: -1px;
      text-shadow: 0 1px 3px rgba(160, 100, 50, 0.15);
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .yb-cd-num.tick {
      transform: scale(1.12);
    }

    .yb-cd-unit-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2.5px;
      color: var(--c-muted);
      text-transform: uppercase;
    }

    /* 分隔冒號 */
    .yb-cd-sep {
      font-family: 'DM Mono', monospace;
      font-size: clamp(24px, 6vw, 40px);
      color: var(--c-primary);
      line-height: 1;
      padding: 0 2px;
      margin-bottom: 18px;
      animation: blink 1s step-end infinite;
      flex-shrink: 0;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.7; }
      50%       { opacity: 0.2; }
    }

    /* ── 底部進度條 ── */
    .yb-cd-progress-wrap {
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .yb-cd-progress-track {
      flex: 1;
      height: 4px;
      background: rgba(180, 130, 90, 0.18);
      border-radius: 4px;
      overflow: hidden;
    }

    .yb-cd-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #d4a060, #c9693a);
      border-radius: 4px;
      transition: width 1s linear;
      box-shadow: 0 0 6px rgba(210, 140, 60, 0.35);
    }

    .yb-cd-progress-pct {
      font-size: 10px;
      font-weight: 700;
      color: var(--c-muted);
      letter-spacing: 1px;
      min-width: 36px;
      text-align: right;
    }

    /* ── 結束畫面 ── */
    .yb-cd-ended {
      display: none;
      text-align: center;
      padding: 6px 0;
    }
    .yb-cd-ended-text {
      font-family: 'Noto Serif TC', serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--c-accent);
      letter-spacing: 3px;
    }

    /* ── RWD ── */
    @media (max-width: 540px) {
      .yb-countdown-bar { padding: 16px 18px 18px; border-radius: 12px; margin-bottom: 20px; }
      .yb-cd-label-text { font-size: 12px; }
      .yb-cd-deadline   { font-size: 10px; }
      .yb-cd-unit-label { font-size: 9px; letter-spacing: 1.5px; }
      .yb-cd-sep        { padding: 0 1px; }
    }
  </style>
</head>
<body>
  <div class="yb-wrap">
    <div class="yb-countdown-bar" role="timer" aria-label="優惠倒數計時">

      <div class="yb-cd-top">
        <div class="yb-cd-label">
          <span class="yb-cd-flame" aria-hidden="true">🔥</span>
          <span class="yb-cd-label-text">限時優惠倒數</span>
        </div>
        <span class="yb-cd-deadline">截止 5 / 9 &nbsp;12:00</span>
      </div>

      <div id="yb-cd-live">
        <div class="yb-cd-units" aria-live="off">
          <div class="yb-cd-unit">
            <div class="yb-cd-num-wrap">
              <span class="yb-cd-num" id="cd-days">00</span>
            </div>
            <span class="yb-cd-unit-label">天</span>
          </div>
          <span class="yb-cd-sep" aria-hidden="true">:</span>
          <div class="yb-cd-unit">
            <div class="yb-cd-num-wrap">
              <span class="yb-cd-num" id="cd-hours">00</span>
            </div>
            <span class="yb-cd-unit-label">時</span>
          </div>
          <span class="yb-cd-sep" aria-hidden="true">:</span>
          <div class="yb-cd-unit">
            <div class="yb-cd-num-wrap">
              <span class="yb-cd-num" id="cd-mins">00</span>
            </div>
            <span class="yb-cd-unit-label">分</span>
          </div>
          <span class="yb-cd-sep" aria-hidden="true">:</span>
          <div class="yb-cd-unit">
            <div class="yb-cd-num-wrap">
              <span class="yb-cd-num" id="cd-secs">00</span>
            </div>
            <span class="yb-cd-unit-label">秒</span>
          </div>
        </div>

        <div class="yb-cd-progress-wrap">
          <div class="yb-cd-progress-track">
            <div class="yb-cd-progress-fill" id="cd-bar" style="width: 100%"></div>
          </div>
          <span class="yb-cd-progress-pct" id="cd-pct">—</span>
        </div>
      </div>

      <div class="yb-cd-ended" id="yb-cd-ended">
        <span class="yb-cd-ended-text">優惠已結束，感謝參與 🎉</span>
      </div>

    </div>
  </div>

  <script>
    const DEADLINE = new Date('2026-05-09T12:00:00+08:00').getTime();
    const START    = new Date('2026-05-04T00:00:00+08:00').getTime();

    const elDays  = document.getElementById('cd-days');
    const elHours = document.getElementById('cd-hours');
    const elMins  = document.getElementById('cd-mins');
    const elSecs  = document.getElementById('cd-secs');
    const elBar   = document.getElementById('cd-bar');
    const elPct   = document.getElementById('cd-pct');
    const elLive  = document.getElementById('yb-cd-live');
    const elEnded = document.getElementById('yb-cd-ended');

    function pad(n) { return String(n).padStart(2, '0'); }

    function animateTick(el, newVal) {
      if (el.textContent === newVal) return;
      el.textContent = newVal;
      el.classList.remove('tick');
      void el.offsetWidth;
      el.classList.add('tick');
      setTimeout(() => el.classList.remove('tick'), 200);
    }

    function tick() {
      const now  = Date.now();
      const diff = DEADLINE - now;

      if (diff <= 0) {
        elLive.style.display  = 'none';
        elEnded.style.display = 'block';
        return;
      }

      const days  = Math.floor(diff / 86400000);
      const hours = Math.floor((diff % 86400000) / 3600000);
      const mins  = Math.floor((diff % 3600000)  / 60000);
      const secs  = Math.floor((diff % 60000)    / 1000);

      animateTick(elDays,  pad(days));
      animateTick(elHours, pad(hours));
      animateTick(elMins,  pad(mins));
      animateTick(elSecs,  pad(secs));

      const total   = DEADLINE - START;
      const elapsed = now - START;
      const pct     = Math.min(100, Math.max(0, (elapsed / total) * 100));
      elBar.style.width = (100 - pct).toFixed(2) + '%';
      elPct.textContent = Math.ceil(100 - pct) + '%';
    }

    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
