<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;700&display=swap');

  :root {
    --c-primary:    #c9a98a;
    --c-primary-dk: #b08d7a;
    --c-accent:     #d4704a;
    --c-bg:         #fdf9f6;
    --c-card:       #fff;
    --c-border:     #ede5dc;
    --c-text:       #2d2d2d;
    --c-muted:      #888;
    --r-card: 16px;
    --r-sm:   12px;
  }
  .yb-wrap { font-family: 'Noto Sans TC', 'Helvetica Neue', Arial, sans-serif; max-width: 780px; margin: 0 auto; padding: 0 16px; }
  .yb-section-pad { padding: 28px 0 8px; }
  .yb-header { text-align: center; padding: 40px 20px 32px; border-bottom: 2px solid #e8ddd5; background: linear-gradient(160deg, #fdf6ee 0%, #f5e8d8 55%, #ede0cc 100%); border-radius: 16px 16px 0 0; }
  .yb-header .logo-line { font-size: 11px; letter-spacing: 4px; color: var(--c-primary-dk); text-transform: uppercase; margin-bottom: 10px; font-weight: 500; }
  .yb-header h1 { font-family: 'Noto Serif TC', serif; font-size: 26px; font-weight: 700; color: #1a1a1a; letter-spacing: 1px; margin-bottom: 6px; }
  .yb-header .date-badge { display: inline-block; background: var(--c-primary); color: #fff; font-size: 13px; padding: 6px 22px; border-radius: 30px; letter-spacing: 1px; margin-top: 12px; }

  @media (max-width: 540px) {
    .yb-header { padding: 32px 16px 24px; }
    .yb-header .logo-line { letter-spacing: 2px; }
    .yb-header h1 { font-size: 22px; }
    .yb-header .date-badge { font-size: 12px; padding: 5px 16px; }
  }
</style>

<div class="yb-wrap">
  <div class="yb-header">
    <div class="logo-line">Yboutique × HEIWEI 何謂美</div>
    <h1>品牌聯名開團</h1>
    <div class="date-badge" aria-label="團購時間：2026年5月1日至5月10日">團購時間 2026 / 5 / 1 — 5 / 10</div>
  </div>
</div>
