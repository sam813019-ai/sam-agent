<style>
  .yb-wrap { font-family: 'Noto Sans TC', 'Helvetica Neue', Arial, sans-serif; max-width: 780px; margin: 0 auto; padding: 0 16px; color: var(--c-text, #2d2d2d); }
  .yb-section-title { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; letter-spacing: 2px; color: var(--c-primary-dk, #b08d7a); text-transform: uppercase; margin-bottom: 16px; }
  .yb-section-title::before { content: ''; display: block; width: 4px; height: 18px; background: var(--c-primary, #c9a98a); border-radius: 2px; }
  .yb-pay-block { background: var(--c-card, #fff); border: 1px solid var(--c-border, #ede5dc); border-radius: var(--r-sm, 12px); padding: 10px 20px; margin-bottom: 20px; }
  .yb-pay-item { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid #f5ede5; font-size: 13px; min-height: 52px; }
  .yb-pay-item:last-child { border-bottom: none; }
  .yb-pay-icon { width: 32px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: var(--c-primary-dk, #b08d7a); }
  .yb-pay-name { font-weight: 600; color: var(--c-text, #2d2d2d); }
  .yb-pay-note { font-size: 11px; color: var(--c-muted, #888); margin-top: 3px; }

  @media (max-width: 540px) {
    .yb-pay-block { padding: 8px 16px; }
    .yb-pay-item { gap: 12px; }
  }
</style>

<div class="yb-wrap">
  <div style="padding: 28px 0 8px;">

    <div class="yb-section-title">付款方式</div>
    <div class="yb-pay-block">

      <!-- 信用卡 -->
      <div class="yb-pay-item">
        <div class="yb-pay-icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="1" y="4" width="22" height="16" rx="2" ry="2"/>
            <line x1="1" y1="10" x2="23" y2="10"/>
          </svg>
        </div>
        <div>
          <div class="yb-pay-name">信用卡</div>
          <div class="yb-pay-note">完成訂單後 15 分鐘內完成付款，逾時系統自動取消</div>
        </div>
      </div>

      <!-- 超商取貨付款 -->
      <div class="yb-pay-item">
        <div class="yb-pay-icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
        </div>
        <div>
          <div class="yb-pay-name">超商取貨付款</div>
          <div class="yb-pay-note">取貨時於門市付款</div>
        </div>
      </div>

      <!-- Apple Pay -->
      <div class="yb-pay-item">
        <div class="yb-pay-icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="2" width="14" height="20" rx="2" ry="2"/>
            <line x1="12" y1="18" x2="12.01" y2="18"/>
          </svg>
        </div>
        <div>
          <div class="yb-pay-name">Apple Pay</div>
          <div class="yb-pay-note">完成訂單後 15 分鐘內完成付款，逾時系統自動取消</div>
        </div>
      </div>

      <!-- LINE Pay -->
      <div class="yb-pay-item">
        <div class="yb-pay-icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="m3 21 1.9-5.7a8.5 8.5 0 1 1 3.8 3.8z"/>
          </svg>
        </div>
        <div>
          <div class="yb-pay-name">LINE Pay</div>
          <div class="yb-pay-note">完成訂單後 15 分鐘內完成付款，逾時系統自動取消</div>
        </div>
      </div>

    </div>
  </div>
</div>
