<style>
  .yb-wrap { font-family: 'Noto Sans TC', 'Helvetica Neue', Arial, sans-serif; max-width: 780px; margin: 0 auto; padding: 0 16px; color: var(--c-text, #2d2d2d); }
  .yb-section-title { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; letter-spacing: 2px; color: var(--c-primary-dk, #b08d7a); text-transform: uppercase; margin-bottom: 16px; }
  .yb-section-title::before { content: ''; display: block; width: 4px; height: 18px; background: var(--c-primary, #c9a98a); border-radius: 2px; }
  .yb-gift-banner { background: linear-gradient(135deg, #fdf0e8 0%, #fae8d8 100%); border: 2px solid #e8c9aa; border-radius: var(--r-card, 16px); padding: 22px 24px; display: flex; align-items: center; gap: 20px; }
  .yb-gift-icon { width: 48px; height: 48px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #a0694a; }
  .yb-gift-title { font-size: 17px; font-weight: 700; color: #a0694a; margin-bottom: 6px; }
  .yb-gift-desc { font-size: 13px; color: #7a5a3a; line-height: 1.6; }
  .yb-gift-tag { display: inline-block; background: var(--c-primary, #c9a98a); color: #fff; font-size: 11px; padding: 2px 10px; border-radius: 10px; margin-left: 6px; }
  .yb-gift-limit { font-size: 11px; color: #a88060; margin-top: 6px; }

  /* 贈品印章 */
  .yb-gift-banner { position: relative; overflow: hidden; }
  .yb-gift-stamp {
    position: absolute;
    top: 50%;
    right: 28px;
    transform: translateY(-50%) rotate(-18deg);
    border: 3px solid rgba(180, 30, 30, 0.75);
    border-radius: 6px;
    padding: 6px 14px;
    text-align: center;
    pointer-events: none;
    background: rgba(255, 255, 255, 0.08);
  }
  .yb-gift-stamp-text {
    display: block;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 2px;
    color: rgba(180, 30, 30, 0.80);
    line-height: 1.5;
    font-family: 'Noto Sans TC', 'Helvetica Neue', Arial, sans-serif;
    text-shadow: 0 0 1px rgba(180, 30, 30, 0.2);
    white-space: nowrap;
  }
  .yb-gift-stamp::before {
    content: '';
    position: absolute;
    inset: 3px;
    border: 1px solid rgba(180, 30, 30, 0.35);
    border-radius: 3px;
  }
  @media (max-width: 540px) {
    .yb-gift-stamp { right: 12px; padding: 5px 10px; }
    .yb-gift-stamp-text { font-size: 11px; letter-spacing: 1.5px; }
  }
  .yb-free-ship-banner { background: var(--c-card, #fff); border: 1.5px solid var(--c-primary, #c9a98a); border-radius: var(--r-sm, 12px); padding: 14px 20px; margin-top: 14px; display: flex; align-items: center; gap: 12px; }
  .yb-free-ship-icon { width: 32px; height: 32px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #a0694a; }
  .yb-free-ship-text { font-size: 14px; font-weight: 700; color: #a0694a; }
  .yb-free-ship-sub { font-size: 12px; color: var(--c-primary-dk, #b08d7a); margin-top: 2px; }

  @media (max-width: 540px) {
    .yb-gift-banner { padding: 18px 16px; gap: 14px; }
    .yb-gift-icon { width: 40px; height: 40px; }
    .yb-gift-title { font-size: 15px; }
    .yb-free-ship-banner { padding: 12px 16px; }
  }
</style>

<div class="yb-wrap">
  <div style="padding: 28px 0 8px;">
    <div class="yb-section-title">下單禮 &amp; 免運</div>

    <!-- 下單禮 -->
    <div class="yb-gift-banner">
      <div class="yb-gift-icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 12 20 22 4 22 4 12"/>
          <rect x="2" y="7" width="20" height="5"/>
          <line x1="12" y1="22" x2="12" y2="7"/>
          <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/>
          <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/>
        </svg>
      </div>
      <div>
        <div class="yb-gift-title">單筆消費滿 $999 即贈</div>
        <div class="yb-gift-desc">
          魚子亮白化妝水 15ML
          <span class="yb-gift-tag">原價 $240</span>
        </div>
        <div class="yb-gift-limit">數量有限 500 份，先搶先贏，贈完為止</div>
      </div>
      <!-- 贈品印章 -->
      <div class="yb-gift-stamp" aria-label="贈品已全數贈送完畢">
        <span class="yb-gift-stamp-text">贈品已全數</span>
        <span class="yb-gift-stamp-text">贈送完畢</span>
      </div>
    </div>

    <!-- 免運費 -->
    <div class="yb-free-ship-banner">
      <div class="yb-free-ship-icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="1" y="3" width="15" height="13"/>
          <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/>
          <circle cx="5.5" cy="18.5" r="2.5"/>
          <circle cx="18.5" cy="18.5" r="2.5"/>
        </svg>
      </div>
      <div>
        <div class="yb-free-ship-text">單筆消費滿 $999 免運費</div>
        <div class="yb-free-ship-sub">台灣本島 &amp; 離島均適用，以單筆訂單金額計算</div>
      </div>
    </div>

  </div>
</div>
