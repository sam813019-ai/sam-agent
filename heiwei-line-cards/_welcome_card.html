<meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1040px;height:1040px;overflow:hidden;
  font-family:"PingFang TC","Noto Sans TC","Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased}
/* 多頁訊息＝輪播卡片，每張僅約 240pt 寬，圖會被大幅縮小。
   ⚠️ 圖裡只放「一個大訊息」，細項文字請放在 LINE 卡片的文字欄位，
      放進圖裡一定會糊。
   ⚠️ 上緣 190px、下緣 310px 淨空，避開 LINE 疊的標題與按鈕。 */
.card{width:1040px;height:1040px;position:relative;background:#F4F2ED;color:#25262A;
  padding:190px 80px 310px;display:flex;flex-direction:column;justify-content:center}
.card::after{content:"";position:absolute;right:-190px;top:30px;width:640px;height:640px;
  border-radius:50%;background:radial-gradient(circle,rgba(140,154,142,.30),transparent 68%)}
.in{position:relative;z-index:2}
.eyebrow{font-size:42px;font-weight:700;letter-spacing:.3em;opacity:.55;margin-bottom:18px}
.big{font-size:300px;font-weight:700;line-height:.86;letter-spacing:-.05em;color:#8C9A8E}
.big small{font-size:96px;font-weight:700;letter-spacing:0}
.sub{font-size:52px;font-weight:700;line-height:1.35;margin-top:26px}
.mark{position:absolute;top:70px;right:80px;text-align:right;z-index:2}
.mark .w{font-size:30px;font-weight:700;letter-spacing:.34em;line-height:1}
.mark .sub2{font-size:13px;font-weight:400;letter-spacing:.62em;opacity:.5;margin-top:10px}
</style>
<div class=card>
  <div class=mark><div class=w>HEIWEI</div><div class=sub2>何 謂 美</div></div>
  <div class=in>
    <div class=eyebrow>歡 迎 禮</div>
    <div class=big>100<small> 元</small></div>
    <div class=sub>優惠券　無消費門檻</div>
  </div>
</div>
