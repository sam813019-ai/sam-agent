<meta charset="utf-8"><link rel="stylesheet" href="_card_base.css">
<style>
.card{background:#F4F2ED;color:#25262A}
.card::after{content:"";position:absolute;right:-200px;top:-200px;width:660px;height:660px;
  border-radius:50%;background:radial-gradient(circle,rgba(140,154,142,.30),transparent 68%)}
.rule{background:#8C9A8E}
.code{background:#25262A;color:#F7F6F3}
.big{color:#8C9A8E}
.tag{display:inline-block;font-size:21px;letter-spacing:.2em;border:1.5px solid rgba(37,38,42,.28);
  padding:10px 24px;border-radius:999px;margin-bottom:24px}
.steps{font-size:25px;line-height:1.95;opacity:.8;margin-top:22px}
.steps b{font-weight:700}
.num{display:inline-block;width:34px;height:34px;line-height:34px;text-align:center;
  background:#25262A;color:#F7F6F3;border-radius:50%;font-size:19px;font-weight:700;margin-right:12px;
  vertical-align:2px}
</style>
<div class=card>
  <div>
    <div class=logo>HEIWEI<div class=sub>何 謂 美</div></div>
  </div>
  <div style="position:relative;z-index:2">
    <div class=tag>歡 迎 加 入</div>
    <div class=headline>送你一張<br>100 元優惠券</div>
    <div class=big>100<small> 元</small></div>
    <div class=steps>
      <span class=num>1</span>點下方「立即領取」<br>
      <span class=num>2</span>選「<b>使用 LINE 登入</b>」<br>
      <span class=num>3</span>優惠券自動進你的帳戶
    </div>
    <div class=rule></div>
    <div class=code>立 即 領 取</div>
  </div>
  <div class=foot>無消費門檻　｜　11/15 前有效　｜　每人限領一次<br>登入後出貨通知、補貨提醒都會發到這裡</div>
</div>
