<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Outfit:wght@300;400;600;700&display=swap');

/* ── 共用底（每支區塊各有一份，改這支不會影響其他區塊）── */
.gb{
  --brand:#C9A98A; --brand-dk:#A8886A; --brand-soft:#F6EDE4;
  --accent:#D4704A; --sky:#2E9FC9; --sky-soft:#E8F6FB;
  --pink:#E0668A; --pink-soft:#FDF1F4;
  --ink:#2C2A28; --muted:#6F675F; --line:#EAE0D6; --card:#fff; --ok:#3E9349;
  font-family:'Noto Sans TC','PingFang TC','Helvetica Neue',Arial,sans-serif;
  color:var(--ink); font-size:16px; line-height:1.75; text-align:left;
  max-width:780px; margin:44px auto 0; padding:0 16px;
}
.gb *{box-sizing:border-box; margin:0; padding:0; min-width:0;}
.gb img{max-width:100%; height:auto; display:block;}
.gb :focus-visible{outline:3px solid var(--sky); outline-offset:3px; border-radius:6px;}
.gb .gb-h2{
  display:flex; align-items:center; gap:10px; font-size:14px; font-weight:700;
  letter-spacing:.18em; color:var(--brand-dk); text-transform:uppercase; margin-bottom:16px;
}
.gb .gb-h2::before{content:""; width:4px; height:18px; background:var(--brand); border-radius:2px; flex:0 0 4px;}
.gb .gb-lead{font-size:15px; color:var(--muted); margin:-8px 0 18px;}
@media (prefers-reduced-motion:reduce){
  .gb *,.gb *::before,.gb *::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
}

/* ── 本區塊專用 ── */
.gb-perks .perk{display:flex; gap:14px; align-items:flex-start; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px; margin-bottom:12px;}
.gb-perks .perk:last-child{margin-bottom:0;}
.gb-perks .perk-ic{flex:0 0 42px; width:42px; height:42px; border-radius:50%; background:var(--brand-soft); display:flex; align-items:center; justify-content:center;}
.gb-perks .perk-ic svg{width:22px; height:22px; stroke:var(--brand-dk); fill:none; stroke-width:1.6;}
.gb-perks .perk b{display:block; font-size:16px;}
.gb-perks .perk p{font-size:13.5px; color:var(--muted); margin-top:2px;}
</style>

<section class="gb gb-perks">
  <h2 class="gb-h2">下單好康</h2>

  <div class="perk">
    <span class="perk-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M3 12h18M12 8v12"/><path d="M12 8s-1.6-4-4-4a2 2 0 000 4zM12 8s1.6-4 4-4a2 2 0 010 4z"/></svg></span>
    <div>
      <b>單筆滿 $4,000 送洗面乳</b>
      <p>直接隨單附贈，不需登記，數量有限送完為止。</p>
    </div>
  </div>

  <div class="perk">
    <span class="perk-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7z"/><circle cx="7" cy="18" r="1.8"/><circle cx="17.5" cy="18" r="1.8"/></svg></span>
    <div>
      <b>單筆滿 $1,000 免運費</b>
      <p>台灣本島與離島均適用，以單筆訂單金額計算。</p>
    </div>
  </div>
</section>
