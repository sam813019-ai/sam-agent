<!-- ═══════════════ 組合優惠 ═══════════════
     這支檔案可以單獨開、單獨改，改完跑 bash build.sh 重組 index.html
     ══════════════════════════════════════════ -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Outfit:wght@300;400;600;700&display=swap');

/* ── 共用底（每支區塊各有一份，改這支不會影響其他區塊）── */
.gb{
  --brand:#C9A98A; --brand-dk:#A8886A; --brand-soft:#F6EDE4;
  --accent:#D4704A; --sky:#2E9FC9; --sky-soft:#E8F6FB;
  --pink:#E0668A; --pink-soft:#FDF1F4;
  --ink:#2C2A28; --muted:#6F675F; --line:#EAE0D6; --card:#fff; --ok:#3E9349;
  font-family:'Noto Sans TC','PingFang TC','Helvetica Neue',Arial,sans-serif;
  color:var(--ink); font-size:16px; line-height:1.75; text-align:left;
  max-width:780px; margin:44px auto 0; padding:0 16px;
}
.gb *{box-sizing:border-box; margin:0; padding:0; min-width:0;}
.gb img{max-width:100%; height:auto; display:block;}
.gb :focus-visible{outline:3px solid var(--sky); outline-offset:3px; border-radius:6px;}
.gb .gb-h2{
  display:flex; align-items:center; gap:10px; font-size:14px; font-weight:700;
  letter-spacing:.18em; color:var(--brand-dk); text-transform:uppercase; margin-bottom:16px;
}
.gb .gb-h2::before{content:""; width:4px; height:18px; background:var(--brand); border-radius:2px; flex:0 0 4px;}
.gb .gb-lead{font-size:15px; color:var(--muted); margin:-8px 0 18px;}
@media (prefers-reduced-motion:reduce){
  .gb *,.gb *::before,.gb *::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
}

/* ── 本區塊專用 ── */
.gb-combos .combos{display:grid; gap:14px;}
.gb-combos .combo{
  position:relative; overflow:hidden; border-radius:18px; padding:20px;
  background:linear-gradient(140deg,#FFF7F0,#FBEFE6); border:1.5px solid #EBD8C6;
}
.gb-combos .combo.is-hot{background:linear-gradient(140deg,var(--sky-soft),var(--pink-soft)); border-color:#CFE6F0;}
.gb-combos .combo-tag{
  display:inline-block; padding:3px 12px; border-radius:20px; background:var(--accent); color:#fff;
  font-size:11px; font-weight:700; letter-spacing:.1em; margin-bottom:8px;
}
.gb-combos .combo.is-hot .combo-tag{background:linear-gradient(120deg,var(--pink),#C0456B);}
.gb-combos .combo h3{font-size:19px; margin-bottom:4px;}
.gb-combos .contents{font-size:14px; color:var(--muted); margin-bottom:12px;}
.gb-combos .combo-price{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
.gb-combos .combo-now{font-family:'Outfit',sans-serif; font-size:30px; font-weight:700; color:var(--accent); line-height:1;}
.gb-combos .combo.is-hot .combo-now{color:var(--pink);}
.gb-combos .combo-was{font-size:14px; color:var(--muted); text-decoration:line-through;}
.gb-combos .combo-save{display:inline-block; padding:3px 12px; border-radius:20px; background:#fff; font-size:13px; font-weight:700; color:var(--ok);}
@media (min-width:721px){ .gb-combos .combos{grid-template-columns:1fr 1fr;} }
</style>

<section class="gb gb-combos">
  <h2 class="gb-h2">組合優惠</h2>
  <p class="gb-lead">整組買最省，也最好搭配使用。</p>

  <div class="combos">
    <article class="combo is-hot">
      <span class="combo-tag">團購主打</span>
      <h3>夏日防曬三重奏</h3>
      <p class="contents">爆白防曬隔離噴霧 ×1　＋　B 群保濕噴霧 ×1　＋　爆白潤色防曬棒 ×1</p>
      <div class="combo-price">
        <span class="combo-now">$1,999</span>
        <span class="combo-was">原價 $3,020</span>
        <span class="combo-save">省 $1,021</span>
      </div>
    </article>

    <article class="combo">
      <span class="combo-tag">補水 ＋ 防曬</span>
      <h3>保濕防曬雙件組</h3>
      <p class="contents">B 群保濕噴霧 ×1　＋　爆白潤色防曬棒 ×1</p>
      <div class="combo-price">
        <span class="combo-now">$1,550</span>
        <span class="combo-was">原價 $2,180</span>
        <span class="combo-save">省 $630</span>
      </div>
    </article>
  </div>
</section>
