<!-- ═══════════════ 首屏／開團倒數 ═══════════════
     改開團日期：搜尋下方 START 與 END 這兩行，還有 .gb-hero 裡的日期文字
     ══════════════════════════════════════════ -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Outfit:wght@300;400;600;700&display=swap');

.gb-hero{
  --sky:#2E9FC9; --pink:#E0668A;
  font-family:'Noto Sans TC','PingFang TC','Helvetica Neue',Arial,sans-serif;
  position:relative; overflow:hidden; text-align:center; line-height:1.75;
  background:linear-gradient(168deg,#CFE9F4 0%,#EFF7FB 42%,#FBEAF0 78%,#FDF6F2 100%);
  padding:34px 20px 26px; border-radius:0 0 26px 26px;
}
.gb-hero *{box-sizing:border-box; margin:0; padding:0;}
.gb-hero::before{
  content:""; position:absolute; top:-80px; right:-70px; width:230px; height:230px; border-radius:50%;
  background:radial-gradient(circle,rgba(255,238,190,.9) 0%,rgba(255,214,140,.45) 42%,rgba(255,214,140,0) 72%);
  animation:gb-breathe 6s ease-in-out infinite;
}
@keyframes gb-breathe{0%,100%{transform:scale(1);}50%{transform:scale(1.12);}}
.gb-hero>*{position:relative; z-index:2;}
.gb-hero .co{font-family:'Outfit',sans-serif; font-size:11px; letter-spacing:.3em; color:#3C6675; text-transform:uppercase;}
.gb-hero h1{font-size:29px; font-weight:900; letter-spacing:.04em; margin:10px 0 6px; color:#123A4B;}
.gb-hero .sub{font-size:15px; color:#3C6675;}
/* 副標的斷行：手機才換行，桌機維持一行 */
.gb-hero .sub .br-m{display:none;}
@media (max-width:720px){ .gb-hero .sub .br-m{display:inline;} }
.gb-hero .date-badge{
  display:inline-block; margin-top:16px; padding:8px 22px; border-radius:30px;
  background:rgba(255,255,255,.9); color:#123A4B; font-weight:700; font-size:15px; letter-spacing:.04em;
}
.gb-hero .countdown{display:flex; justify-content:center; gap:8px; margin-top:16px;}
.gb-hero .cd-cell{background:rgba(255,255,255,.9); border-radius:12px; min-width:62px; padding:9px 6px;}
.gb-hero .cd-num{font-family:'Outfit',sans-serif; font-size:24px; font-weight:700; line-height:1; color:var(--pink);}
.gb-hero .cd-lab{font-size:11px; color:#5E7C88; letter-spacing:.08em; margin-top:3px;}
.gb-hero .cd-note{font-size:13px; color:#3C6675; margin-top:10px;}
@media (min-width:721px){ .gb-hero h1{font-size:38px;} }
@media (prefers-reduced-motion:reduce){ .gb-hero::before{animation:none;} }
</style>

<header class="gb-hero">
  <p class="co">Yboutique × HEIWEI 何謂美</p>
  <h1>夏日防曬三重奏</h1>
  <p class="sub">噴的、擦的，全套備齊。<br class="br-m">新品爆白潤色防曬棒首度開團。</p>
  <p class="date-badge">2026 / 8 / 21（四） — 8 / 25（一）</p>

  <div class="countdown" id="gb-cd" aria-live="polite">
    <div class="cd-cell"><div class="cd-num" data-cd="d">--</div><div class="cd-lab">天</div></div>
    <div class="cd-cell"><div class="cd-num" data-cd="h">--</div><div class="cd-lab">時</div></div>
    <div class="cd-cell"><div class="cd-num" data-cd="m">--</div><div class="cd-lab">分</div></div>
    <div class="cd-cell"><div class="cd-num" data-cd="s">--</div><div class="cd-lab">秒</div></div>
  </div>
  <p class="cd-note" id="gb-cd-note">距離結團</p>
</header>

<script>
(function () {
  'use strict';
  /* ── 開團／結團時間，要改日期改這兩行 ── */
  var START = new Date('2026-08-21T00:00:00+08:00').getTime();
  var END   = new Date('2026-08-25T23:59:59+08:00').getTime();

  var cd = document.getElementById('gb-cd');
  var note = document.getElementById('gb-cd-note');
  if (!cd) return;
  var cell = {
    d: cd.querySelector('[data-cd="d"]'), h: cd.querySelector('[data-cd="h"]'),
    m: cd.querySelector('[data-cd="m"]'), s: cd.querySelector('[data-cd="s"]')
  };
  function pad(n){ return n < 10 ? '0' + n : '' + n; }
  function tick() {
    var now = Date.now(), target, label;
    if (now < START)      { target = START; label = '距離開團'; }
    else if (now <= END)  { target = END;   label = '距離結團'; }
    else { cd.style.display = 'none'; note.textContent = '本團已結束，感謝支持'; return false; }
    var left = Math.max(0, Math.floor((target - now) / 1000));
    cell.d.textContent = Math.floor(left / 86400);
    cell.h.textContent = pad(Math.floor(left % 86400 / 3600));
    cell.m.textContent = pad(Math.floor(left % 3600 / 60));
    cell.s.textContent = pad(left % 60);
    note.textContent = label;
    return true;
  }
  if (tick()) { var t = setInterval(function(){ if (!tick()) clearInterval(t); }, 1000); }
})();
</script>
