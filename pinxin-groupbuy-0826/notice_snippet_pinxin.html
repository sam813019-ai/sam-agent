<!-- 注意事項區塊（品馨配色）
     色碼直接寫死，不用 CSS 變數：一來不會被外層主題的 --c-primary 蓋掉，
     二來貼進 Shopline 也不會因為變數被過濾而失色。 -->
<style>
  .yb-wrap { font-family: 'Noto Sans TC', 'PingFang TC', 'Helvetica Neue', Arial, sans-serif; max-width: 780px; margin: 0 auto; padding: 0 16px; color: #3B2A31; overflow-x: hidden; }
  .yb-section-title { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; letter-spacing: 2px; color: #C9506E; text-transform: uppercase; margin-bottom: 16px; }
  .yb-section-title::before { content: ''; display: block; width: 4px; height: 18px; background: #E98BA6; border-radius: 2px; }
  .yb-notice { background: #FDF4F7; border-left: 3px solid #E98BA6; border-radius: 0 10px 10px 0; padding: 16px 20px; font-size: 13px; color: #8A737B; line-height: 2; }
  .yb-notice strong { color: #C9506E; }
  .yb-notice-item { display: flex; gap: 8px; align-items: flex-start; overflow-wrap: break-word; word-break: break-word; min-width: 0; }
  .yb-notice-item::before { content: '•'; color: #E98BA6; font-size: 13px; line-height: 2; flex-shrink: 0; }
  .yb-notice-text { flex: 1; min-width: 0; }

  @media (max-width: 540px) {
    .yb-section-title { font-size: 12px; letter-spacing: 1px; }
    .yb-notice { padding: 14px; font-size: 13px; line-height: 1.9; }
    .yb-notice-item { gap: 6px; }
  }
</style>

      <div class="yb-notice-item"><span class="yb-notice-text">付款逾時（信用卡／LINE Pay <strong>15 分鐘</strong>）系統將自動取消訂單，請重新下單。</span></div>
      <div class="yb-notice-item"><span class="yb-notice-text">免運優惠以 <strong>單筆訂單金額 $1000 以上</strong>為計算基準。</span></div>

      <div class="yb-notice-item"><span class="yb-notice-text">如有任何問題，請聯繫 LINE 官方帳號 <strong>@heiwei</strong> 或來電 07-343-0072 洽詢。</span></div>
    </div>
  </div>
</div>
