<!-- ═══════════════ 付款方式 ═══════════════
     這支檔案可以單獨開、單獨改，改完跑 bash build.sh 重組 index.html
     ══════════════════════════════════════════ -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Outfit:wght@300;400;600;700&display=swap');

/* ── 共用底（每支區塊各有一份，改這支不會影響其他區塊）── */
.px{
  --rose:#E98BA6; --rose-dk:#C9506E; --rose-soft:#FBE3EA; --rose-mist:#FDF4F7;
  --gold:#C6A78E; --gold-soft:#F7EEE6;
  --ink:#3B2A31; --muted:#8A737B; --line:#F2E2E7; --card:#fff; --ok:#3E9349;
  font-family:'Noto Sans TC','PingFang TC','Helvetica Neue',Arial,sans-serif;
  color:var(--ink); font-size:16px; line-height:1.75; text-align:left;
  max-width:820px; margin:46px auto 0; padding:0 16px;
}
.px *{box-sizing:border-box; margin:0; padding:0; min-width:0;}
.px img{max-width:100%; height:auto; display:block;}
.px :focus-visible{outline:3px solid var(--rose-dk); outline-offset:3px; border-radius:6px;}
.px .px-h2{
  display:flex; align-items:center; gap:10px; font-size:14px; font-weight:700;
  letter-spacing:.18em; color:var(--rose-dk); text-transform:uppercase; margin-bottom:14px;
}
.px .px-h2::before{content:""; width:4px; height:18px; background:var(--rose); border-radius:2px; flex:0 0 4px;}
.px .px-lead{font-size:15px; color:var(--muted); margin:-6px 0 18px;}
@media (prefers-reduced-motion:reduce){
  .px *,.px *::before,.px *::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
}

/* ── 本區塊專用 ── */
.px-pay .pay{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
.px-pay .pay-item{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; text-align:center;}
.px-pay .pay-item svg{width:24px; height:24px; stroke:var(--rose-dk); fill:none; stroke-width:1.6; margin:0 auto 6px;}
.px-pay .pay-item b{display:block; font-size:14.5px;}
.px-pay .pay-item span{display:block; font-size:12px; color:var(--muted); line-height:1.6; margin-top:2px;}
@media (min-width:721px){ .px-pay .pay{grid-template-columns:repeat(4,1fr);} }
</style>

<section class="px px-pay">
  <h2 class="px-h2">付款方式</h2>
  <div class="pay">
    <div class="pay-item">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5.5" width="19" height="13" rx="2.5"/><path d="M2.5 10h19"/></svg>
      <b>信用卡</b><span>15 分鐘內完成付款</span>
    </div>
    <div class="pay-item">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h16V20H4z"/><path d="M3 9.5L5 4h14l2 5.5"/><path d="M9 20v-5h6v5"/></svg>
      <b>超商取貨付款</b><span>取貨時於門市付款</span>
    </div>
    <div class="pay-item">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5L12 3l8.5 4.5v9L12 21l-8.5-4.5z"/><path d="M3.5 7.5L12 12l8.5-4.5M12 12v9"/></svg>
      <b>超商貨到付款</b><span>送達時付款</span>
    </div>
    <div class="pay-item">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></svg>
      <b>LINE Pay</b><span>15 分鐘內完成付款</span>
    </div>
  </div>
</section>
