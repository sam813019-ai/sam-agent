<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Outfit:wght@300;400;600;700&display=swap');

/* ── 共用底（每支區塊各有一份，改這支不會影響其他區塊）── */
.px{
  --rose:#E98BA6; --rose-dk:#C9506E; --rose-soft:#FBE3EA; --rose-mist:#FDF4F7;
  --gold:#C6A78E; --gold-soft:#F7EEE6;
  --ink:#3B2A31; --muted:#8A737B; --line:#F2E2E7; --card:#fff; --ok:#3E9349;
  font-family:'Noto Sans TC','PingFang TC','Helvetica Neue',Arial,sans-serif;
  color:var(--ink); font-size:16px; line-height:1.75; text-align:left;
  max-width:820px; margin:46px auto 0; padding:0 16px;
}
.px *{box-sizing:border-box; margin:0; padding:0; min-width:0;}
.px img{max-width:100%; height:auto; display:block;}
.px :focus-visible{outline:3px solid var(--rose-dk); outline-offset:3px; border-radius:6px;}
.px .px-h2{
  display:flex; align-items:center; gap:10px; font-size:14px; font-weight:700;
  letter-spacing:.18em; color:var(--rose-dk); text-transform:uppercase; margin-bottom:14px;
}
.px .px-h2::before{content:""; width:4px; height:18px; background:var(--rose); border-radius:2px; flex:0 0 4px;}
.px .px-lead{font-size:15px; color:var(--muted); margin:-6px 0 18px;}
@media (prefers-reduced-motion:reduce){
  .px *,.px *::before,.px *::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
}

/* ── 本區塊專用 ── */
.px-svc .info{background:var(--card); border:1px solid var(--line); border-radius:18px; overflow:hidden;}
.px-svc .info-row{display:grid; grid-template-columns:96px 1fr; gap:12px; padding:14px 16px; border-bottom:1px solid var(--line); font-size:14.5px;}
.px-svc .info-row:last-child{border-bottom:none;}
.px-svc .info-row .k{font-weight:700; color:var(--rose-dk);}
.px-svc .info-row .v{color:var(--muted);}
.px-svc .info-row .v a{color:inherit;}
</style>

<section class="px px-svc">

    <div class="info-row"><span class="k">電子信箱</span><span class="v"><a href="mailto:heiweimei@gmail.com">heiweimei@gmail.com</a></span></div>
    <div class="info-row"><span class="k">公司地址</span><span class="v">高雄市左營區文敬路 59 號 2 樓</span></div>
  </div>
</section>
