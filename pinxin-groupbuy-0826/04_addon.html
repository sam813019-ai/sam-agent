<!-- ═══════════════ 加購價 ═══════════════
     這支檔案可以單獨開、單獨改，改完跑 bash build.sh 重組 index.html
     ══════════════════════════════════════════ -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Outfit:wght@300;400;600;700&display=swap');

/* ── 共用底（每支區塊各有一份，改這支不會影響其他區塊）── */
.px{
  --rose:#E98BA6; --rose-dk:#C9506E; --rose-soft:#FBE3EA; --rose-mist:#FDF4F7;
  --gold:#C6A78E; --gold-soft:#F7EEE6;
  --ink:#3B2A31; --muted:#8A737B; --line:#F2E2E7; --card:#fff; --ok:#3E9349;
  font-family:'Noto Sans TC','PingFang TC','Helvetica Neue',Arial,sans-serif;
  color:var(--ink); font-size:16px; line-height:1.75; text-align:left;
  max-width:820px; margin:46px auto 0; padding:0 16px;
}
.px *{box-sizing:border-box; margin:0; padding:0; min-width:0;}
.px img{max-width:100%; height:auto; display:block;}
.px :focus-visible{outline:3px solid var(--rose-dk); outline-offset:3px; border-radius:6px;}
.px .px-h2{
  display:flex; align-items:center; gap:10px; font-size:14px; font-weight:700;
  letter-spacing:.18em; color:var(--rose-dk); text-transform:uppercase; margin-bottom:14px;
}
.px .px-h2::before{content:""; width:4px; height:18px; background:var(--rose); border-radius:2px; flex:0 0 4px;}
.px .px-lead{font-size:15px; color:var(--muted); margin:-6px 0 18px;}
@media (prefers-reduced-motion:reduce){
  .px *,.px *::before,.px *::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
}

/* ── 本區塊專用 ── */
.px-addon .box{background:linear-gradient(140deg,#FFFBF8,#FBF2EC); border:1.5px solid #EFE0D4; border-radius:20px; padding:18px;}
.px-addon .hint{
  background:#fff; border-radius:14px; padding:12px 14px; font-size:13.5px; color:var(--muted);
  margin-bottom:14px; line-height:1.7;
}
.px-addon .hint b{color:var(--rose-dk);}
.px-addon .addons{display:grid; gap:10px;}
.px-addon .addon{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  background:#fff; border-radius:14px; padding:14px 16px;
}
.px-addon .addon b{font-size:15px; font-weight:700;}
.px-addon .addon-price{white-space:nowrap; text-align:right;}
.px-addon .addon-price .now{font-family:'Outfit',sans-serif; font-size:19px; font-weight:700; color:var(--rose-dk);}
.px-addon .addon-price .was{display:block; font-family:'Outfit',sans-serif; font-size:12.5px; color:var(--muted); text-decoration:line-through;}
@media (min-width:721px){ .px-addon .addons{grid-template-columns:1fr 1fr;} }
</style>

<section class="px px-addon">
  <h2 class="px-h2">加購價</h2>
  <p class="px-lead">下面這幾項是加購專屬價，比單買再便宜一些。</p>

  <div class="box">
    <p class="hint"><b>加購規則：</b>需與本團任一組合或單品一起購買，單獨下加購品無法出貨。每項數量不限。</p>
    <div class="addons">
      <div class="addon">
        <b>5D 養敷面膜（單片）</b>
        <div class="addon-price"><span class="now">$120</span><span class="was">$298</span></div>
      </div>

      <div class="addon">
        <b>魚子亮白化妝水 150ml</b>
        <div class="addon-price"><span class="now">$1,350</span><span class="was">$1,880</span></div>
      </div>

      <div class="addon">
        <b>白膜淨去角質泥膜</b>
        <div class="addon-price"><span class="now">$999</span><span class="was">$2,050</span></div>
      </div>

      <div class="addon">
        <b>爆白潤色防曬棒</b>
        <div class="addon-price"><span class="now">$650</span><span class="was">$990</span></div>
      </div>
    </div>
  </div>
</section>
