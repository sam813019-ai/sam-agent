<!-- ═══════════════ 運費說明／出貨時程 ═══════════════
     這支檔案可以單獨開、單獨改，改完跑 bash build.sh 重組 index.html
     ══════════════════════════════════════════ -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Outfit:wght@300;400;600;700&display=swap');

/* ── 共用底（每支區塊各有一份，改這支不會影響其他區塊）── */
.px{
  --rose:#E98BA6; --rose-dk:#C9506E; --rose-soft:#FBE3EA; --rose-mist:#FDF4F7;
  --gold:#C6A78E; --gold-soft:#F7EEE6;
  --ink:#3B2A31; --muted:#8A737B; --line:#F2E2E7; --card:#fff; --ok:#3E9349;
  font-family:'Noto Sans TC','PingFang TC','Helvetica Neue',Arial,sans-serif;
  color:var(--ink); font-size:16px; line-height:1.75; text-align:left;
  max-width:820px; margin:46px auto 0; padding:0 16px;
}
.px *{box-sizing:border-box; margin:0; padding:0; min-width:0;}
.px img{max-width:100%; height:auto; display:block;}
.px :focus-visible{outline:3px solid var(--rose-dk); outline-offset:3px; border-radius:6px;}
.px .px-h2{
  display:flex; align-items:center; gap:10px; font-size:14px; font-weight:700;
  letter-spacing:.18em; color:var(--rose-dk); text-transform:uppercase; margin-bottom:14px;
}
.px .px-h2::before{content:""; width:4px; height:18px; background:var(--rose); border-radius:2px; flex:0 0 4px;}
.px .px-lead{font-size:15px; color:var(--muted); margin:-6px 0 18px;}
@media (prefers-reduced-motion:reduce){
  .px *,.px *::before,.px *::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
}

/* ── 本區塊專用 ── */
.px-ship .stable{width:100%; border-collapse:collapse; font-size:14px; background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden;}
.px-ship .stable th{background:var(--rose-mist); color:var(--rose-dk); font-size:13px; padding:10px; text-align:center;}
.px-ship .stable td{padding:12px 10px; text-align:center; border-top:1px solid var(--line); color:var(--muted);}
.px-ship .stable td:first-child{color:var(--ink); font-weight:700;}
.px-ship .free{display:inline-block; padding:2px 10px; border-radius:20px; background:#EAF6EC; color:var(--ok); font-weight:700; font-size:12.5px;}
.px-ship .info{background:var(--card); border:1px solid var(--line); border-radius:18px; overflow:hidden;}
.px-ship .info-row{display:grid; grid-template-columns:96px 1fr; gap:12px; padding:14px 16px; border-bottom:1px solid var(--line); font-size:14.5px;}
.px-ship .info-row:last-child{border-bottom:none;}
.px-ship .info-row .k{font-weight:700; color:var(--rose-dk);}
.px-ship .info-row .v{color:var(--muted);}
.px-ship .px-h2.second{margin-top:28px;}
</style>

<section class="px px-ship">
  <h2 class="px-h2">運費說明</h2>
  <table class="stable">
    <thead><tr><th>地區</th><th>寄件方式</th><th>運費</th><th>免運門檻</th></tr></thead>
    <tbody>
      <tr><td>台灣本島</td><td>順豐宅配<br>7-11 超商</td><td>$95<br>$65</td><td><span class="free">滿 $2,000 免運</span></td></tr>
      <tr><td>台灣離島</td><td>郵局宅配<br>7-11 超商</td><td>$95<br>$65</td><td><span class="free">滿 $2,000 免運</span></td></tr>
    </tbody>
  </table>

  <h2 class="px-h2 second">出貨時程</h2>
  <div class="info">
    <div class="info-row"><span class="k">現貨出貨</span><span class="v">下單後約 <strong>1–3 個工作天</strong>安排出貨（不含例假日）</span></div>
    <div class="info-row"><span class="k">結團後</span><span class="v">團購結束後 <strong>3 個工作天內</strong>全數出貨完畢</span></div>
    <div class="info-row"><span class="k">海外地區</span><span class="v">本團<strong>不開放</strong>海外訂單</span></div>
  </div>
</section>
