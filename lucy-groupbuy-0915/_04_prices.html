<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Outfit:wght@300;400;600;700&display=swap');

/* ── 共用底（每支區塊各有一份，改這支不會影響其他區塊）── */
.lc{
  --fruit:#E0533C; --fruit-dk:#B33C29; --fruit-soft:#FBE0D8; --fruit-mist:#FEF5F1;
  --citrus:#E8913F; --citrus-soft:#FDEFDD;
  --ink:#2C2A28; --muted:#7A6C63; --line:#F0E2D8; --card:#fff; --ok:#5F7F52;
  font-family:'Noto Sans TC','PingFang TC','Helvetica Neue',Arial,sans-serif;
  color:var(--ink); font-size:16px; line-height:1.75; text-align:left;
  max-width:820px; margin:46px auto 0; padding:0 16px;
}
.lc *{box-sizing:border-box; margin:0; padding:0; min-width:0;}
.lc img{max-width:100%; height:auto; display:block;}
.lc :focus-visible{outline:3px solid var(--fruit-dk); outline-offset:3px; border-radius:6px;}
.lc .lc-h2{
  display:flex; align-items:center; gap:10px; font-size:14px; font-weight:700;
  letter-spacing:.18em; color:var(--fruit-dk); text-transform:uppercase; margin-bottom:14px;
}
.lc .lc-h2::before{content:""; width:4px; height:18px; background:var(--fruit); border-radius:2px; flex:0 0 4px;}
.lc .lc-lead{font-size:15px; color:var(--muted); margin:-6px 0 18px;}
@media (prefers-reduced-motion:reduce){
  .lc *,.lc *::before,.lc *::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
}

/* ── 本區塊專用 ── */
.lc-prices .pgroup{background:var(--card); border:1px solid var(--line); border-radius:18px; overflow:hidden; margin-bottom:16px;}
.lc-prices .pgroup:last-child{margin-bottom:0;}
.lc-prices .pgroup-head{background:linear-gradient(135deg,var(--fruit),var(--fruit-dk)); color:#fff; padding:14px 18px;}
.lc-prices .pgroup.is-new .pgroup-head{background:linear-gradient(135deg,var(--citrus),#F0A85C);}
.lc-prices .pname{font-size:17px; font-weight:700; letter-spacing:.02em;}
.lc-prices .porig{font-size:12.5px; opacity:.92; margin-top:2px;}
.lc-prices .tag-new{
  display:inline-block; vertical-align:2px; margin-left:7px; padding:1px 8px; border-radius:20px;
  background:rgba(255,255,255,.26); color:#fff;
  font-family:'Outfit',sans-serif; font-size:9.5px; font-weight:700; letter-spacing:.1em;
}
.lc-prices .ptable{width:100%; border-collapse:collapse; font-size:15px;}
.lc-prices .ptable thead th{background:var(--fruit-mist); color:var(--fruit-dk); font-size:12.5px; font-weight:700; letter-spacing:.08em; padding:11px 10px; text-align:center;}
.lc-prices .pgroup.is-new .ptable thead th{background:var(--citrus-soft); color:#9A6320;}
.lc-prices .ptable td{padding:13px 10px; text-align:center; border-top:1px solid var(--line);}
.lc-prices .ptable .qty{font-weight:700;}
.lc-prices .ptable .now{font-family:'Outfit',sans-serif; font-size:18px; font-weight:700; color:var(--fruit-dk);}
.lc-prices .pgroup.is-new .ptable .now{color:#B9701E;}
.lc-prices .ptable .unit{font-size:13px; color:var(--muted);}
.lc-prices .ptable tr.best{background:#FFFBF4;}
.lc-prices .badge{
  display:inline-block; margin-left:6px; padding:1px 8px; border-radius:20px;
  background:var(--fruit); color:#fff; font-size:10.5px; font-weight:700; letter-spacing:.06em; vertical-align:1px;
}
.lc-prices .pgroup.is-new .badge{background:var(--citrus);}
</style>

</section>
