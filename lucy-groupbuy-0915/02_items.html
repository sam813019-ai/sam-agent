<!-- ═══════════════ 團購品項 ═══════════════
     這支檔案可以單獨開、單獨改，改完跑 bash build.sh 重組 index.html
     產品圖直接吃 Shopline 圖床，不需要放進 assets/
     ══════════════════════════════════════════ -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Outfit:wght@300;400;600;700&display=swap');

/* ── 共用底（每支區塊各有一份，改這支不會影響其他區塊）── */
.lc{
  --fruit:#E0533C; --fruit-dk:#B33C29; --fruit-soft:#FBE0D8; --fruit-mist:#FEF5F1;
  --citrus:#E8913F; --citrus-soft:#FDEFDD;
  --ink:#2C2A28; --muted:#7A6C63; --line:#F0E2D8; --card:#fff; --ok:#5F7F52;
  font-family:'Noto Sans TC','PingFang TC','Helvetica Neue',Arial,sans-serif;
  color:var(--ink); font-size:16px; line-height:1.75; text-align:left;
  max-width:820px; margin:46px auto 0; padding:0 16px;
}
.lc *{box-sizing:border-box; margin:0; padding:0; min-width:0;}
.lc img{max-width:100%; height:auto; display:block;}
.lc :focus-visible{outline:3px solid var(--fruit-dk); outline-offset:3px; border-radius:6px;}
.lc .lc-h2{
  display:flex; align-items:center; gap:10px; font-size:14px; font-weight:700;
  letter-spacing:.18em; color:var(--fruit-dk); text-transform:uppercase; margin-bottom:14px;
}
.lc .lc-h2::before{content:""; width:4px; height:18px; background:var(--fruit); border-radius:2px; flex:0 0 4px;}
.lc .lc-lead{font-size:15px; color:var(--muted); margin:-6px 0 18px;}
@media (prefers-reduced-motion:reduce){
  .lc *,.lc *::before,.lc *::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
}

/* ── 本區塊專用 ── */
.lc-items .items{display:grid; gap:14px;}
.lc-items .item{
  display:grid; grid-template-columns:104px 1fr; gap:16px; align-items:center;
  background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px;
}
/* 圖框固定 1:1，美編上傳 1200×1200 正方圖即零裁切 */
.lc-items .item-fig{
  background:var(--fruit-mist); border-radius:14px;
  aspect-ratio:1/1; overflow:hidden;
}
/* 三張都是情境照（非去背），一律滿版填滿框、不留白邊 */
.lc-items .item-fig img{width:100%; height:100%; object-fit:cover; object-position:center;}
/* 各自的視覺重心：現有非正方圖被裁切時主體才不會被切掉；換成 1:1 圖後此設定自動失效 */
.lc-items .fig-spray img{object-position:62% 60%;}  /* 橫幅 3:2：瓶身偏右下 */
.lc-items .fig-mist  img{object-position:50% 42%;}  /* 直幅 2:3：瓶身偏上 */
.lc-items .fig-stick img{object-position:48% 52%;}  /* 方形 1:1：接近置中 */
.lc-items .item.is-new .item-fig{background:linear-gradient(150deg,var(--citrus-soft),var(--fruit-soft));}
.lc-items .item h3{font-size:18px; font-weight:700; letter-spacing:.02em;}
.lc-items .tag-new{
  display:inline-block; vertical-align:2px; margin-left:8px; padding:2px 9px; border-radius:20px;
  background:linear-gradient(120deg,var(--citrus),#F0A85C); color:#fff;
  font-family:'Outfit',sans-serif; font-size:10px; font-weight:700; letter-spacing:.12em;
}
.lc-items .spec{font-family:'Outfit',sans-serif; font-size:12px; color:var(--muted); letter-spacing:.06em; margin-top:2px;}
.lc-items .item p.desc{font-size:14px; color:var(--muted); margin-top:6px;}
@media (min-width:721px){
  .lc-items .items{grid-template-columns:repeat(3,1fr);}
  .lc-items .item{grid-template-columns:1fr; text-align:center; padding:20px;}
}
</style>

<section class="lc lc-items">
  <h2 class="lc-h2">團購品項</h2>

  <div class="items">
    <article class="item is-new">
      <div class="item-fig fig-stick"><img src="https://img.shoplineapp.com/media/image_clips/6a86b154b757ce93911d434e/original.jpg?1787212116=&owner_id=648be21890a1b5008d602f77" alt="HEIWEI 爆白潤色防曬棒 SPF50+" loading="lazy"></div>
      <div>
        <h3>爆白潤色防曬棒<span class="tag-new">NEW</span></h3>
        <p class="spec">SPF50<sup>+</sup> ★★★★｜NET 15g</p>
        <p class="desc">免沾手推開就好，自帶潤色可當底妝，補防曬不用毀妝。</p>
      </div>
    </article>

    <article class="item">
      <div class="item-fig fig-spray"><img src="https://img.shoplineapp.com/media/image_clips/6a86a1da4a84ab3e83e861ee/original.jpg?1787208152=&owner_id=648be21890a1b5008d602f77" alt="HEIWEI 爆白防曬隔離噴霧 2.0" loading="lazy"></div>
      <div>
        <h3>爆白防曬隔離噴霧</h3>
        <p class="spec">SPF40 ★★★★｜150ml</p>
        <p class="desc">噴一下全身都顧到，防曬同時隔離修飾，抗氧化、防水抗汗。</p>
      </div>
    </article>

    <article class="item">
      <div class="item-fig fig-mist"><img src="https://img.shoplineapp.com/media/image_clips/6a86a1b2c90b232686b52554/original.JPG?1787208111=&owner_id=648be21890a1b5008d602f77" alt="HEIWEI B 群保濕噴霧" loading="lazy"></div>
      <div>
        <h3>B 群保濕噴霧</h3>
        <p class="spec">保濕定妝噴霧</p>
        <p class="desc">冷氣房整天不乾荒，妝前打底、妝後定妝、隨時補水都行。</p>
      </div>
    </article>
  </div>
</section>
