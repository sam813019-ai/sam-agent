<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>何謂美 | 黑微美容</title>
    <style>
        /* 基礎重置 */
        html, body {
            margin: 0 !important;
            padding: 0 !important;
            width: 100%;
            background-color: #FFFFFF;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* 影片區塊 */
        .video-hero {
            position: relative;
            width: 100%;
            height: 85vh;
            overflow: hidden;
            background-color: #000;
            display: block;
        }

        /* 隱藏的點擊連結層 */
        .video-link {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            cursor: pointer;
            display: block;
            text-decoration: none;
        }

        /* YouTube 背景嵌入 */
        .video-hero iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 56.25vw;
            min-height: 100%;
            min-width: 177.77vh;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        /* 手機版適應 */
        @media (max-width: 768px) {
            .video-hero { height: 85vh; }
        }
    </style>
</head>
<body>

    <header class="video-hero">
        <a href="https://www.heiweibeauty.com/products/vitamin-b-water"
           class="video-link"
           target="_blank"
           title="查看商品詳情">
        </a>

        <iframe src="https://www.youtube.com/embed/oFZMAJbdEkM?autoplay=1&loop=1&mute=1&controls=0&playsinline=1&playlist=oFZMAJbdEkM&modestbranding=1&rel=0"
                frameborder="0"
                allow="autoplay; fullscreen; encrypted-media"></iframe>
    </header>

    <meta name="google-site-verification" content="VlT1xwLi4ZHZjHgzYnRB8_3qVjkXoZ_LZxgbL4B3QeE" />
</body>
</html>
